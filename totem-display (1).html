<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>Totem</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
#totem{position:fixed;inset:0;background:var(--bg,#0f172a);color:#fff}
#stage{position:absolute;inset:0;display:grid;place-items:center;overflow:hidden}
.slide{position:absolute;inset:0;display:grid;place-items:center;opacity:0;transition:transform .6s ease,opacity .6s ease}
.slide.in{opacity:1;transform:none}
.slide.fade{transform:none}
.slide.slide-left{transform:translateX(100%)}
.slide.slide-left.in{transform:translateX(0)}
.slide.slide-right{transform:translateX(-100%)}
.slide.slide-right.in{transform:translateX(0)}
.slide.slide-up{transform:translateY(100%)}
.slide.slide-up.in{transform:translateY(0)}
.slide.slide-down{transform:translateY(-100%)}
.slide.slide-down.in{transform:translateY(0)}
.slide.zoom{transform:scale(1.3)}
.slide.zoom.in{transform:scale(1)}
.slide img,.slide video{max-width:100%;max-height:100%;object-fit:contain}
.txt{width:100%;height:100%;display:grid;place-items:center;padding:6vw;text-align:center;white-space:pre-wrap;word-break:break-word}
.txt.left{text-align:left}.txt.right{text-align:right}
.notice{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:6vw;gap:20px}
.notice h2{font-size:clamp(28px,6vw,72px)}
.notice p{font-size:clamp(16px,3vw,32px);max-width:80%;opacity:.92}
.notice-tag{padding:8px 22px;border-radius:999px;font-weight:700;font-size:clamp(12px,1.6vw,18px);letter-spacing:.05em;text-transform:uppercase}
.event{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:6vw;gap:14px}
.event .ico{font-size:clamp(40px,8vw,90px)}
.event h2{font-size:clamp(26px,5vw,60px)}
.event p{font-size:clamp(15px,2.4vw,26px);opacity:.9}
.event .when{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-top:6px}
.event .when span{background:#ffffff22;padding:8px 18px;border-radius:12px;font-size:clamp(14px,2vw,22px)}
#topbar{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:22px 30px;z-index:10;pointer-events:none}
#brand{display:flex;align-items:center;gap:12px;text-shadow:0 2px 8px #0008}
#brand img{height:44px;border-radius:8px}
#brand strong{font-size:clamp(15px,2vw,22px)}
#clock{text-align:right;text-shadow:0 2px 8px #0008}
#clock .time{font-size:clamp(20px,3vw,34px);font-weight:700}
#clock .date{font-size:clamp(11px,1.4vw,15px);opacity:.8;text-transform:capitalize}
#exitBtn{position:absolute;top:22px;right:0;transform:translateY(46px);pointer-events:auto;background:#ffffff22;backdrop-filter:blur(6px);border:1px solid #ffffff33;color:#fff;border-radius:10px;padding:9px 14px;font-size:13px;cursor:pointer;margin-right:30px;opacity:0;transition:opacity .3s}
#totem:hover #exitBtn,#totem:focus-within #exitBtn{opacity:1}
#progressWrap{position:absolute;bottom:0;left:0;right:0;height:6px;background:#ffffff1f;z-index:10}
#progressBar{height:100%;width:0%;background:var(--primary,#2563eb)}
#dots{position:absolute;bottom:16px;left:0;right:0;display:flex;justify-content:center;gap:7px;z-index:9}
#dots span{width:7px;height:7px;border-radius:50%;background:#ffffff40}
#dots span.on{background:#fff}
#badge{position:absolute;bottom:16px;right:18px;z-index:9;opacity:.9}
#badge img{width:58px;height:58px;display:block}
#empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:30px}
#empty h1{font-size:clamp(22px,4vw,40px);margin-bottom:10px}
#empty p{opacity:.7;font-size:clamp(13px,1.8vw,18px)}
</style>
</head>

 </div>

function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function typeLabel(t){return{urgente:'Urgente',atencao:'Atenção',info:'Informação'}[t]||''}
function applyTheme(){
 const s=db.settings||{};
 document.documentElement.style.setProperty('--bg',s.backgroundColor||'#0f172a');
 document.documentElement.style.setProperty('--primary',s.primaryColor||'#2563eb');
 document.getElementById('brandName').textContent=s.schoolName||'Escola José Giestas';
 const logo=document.getElementById('brandLogo');
 logo.src=s.logoUrl||DEFAULT_LOGO;logo.style.display='block';
}
function buildDots(){
 document.getElementById('dots').innerHTML=list.map((_,i)=>`<span class="${i===idx?'on':''}"></span>`).join('');
}
function renderSlide(x){
 let inner='';
 if(x.type==='image')inner=x.mediaUrl?`<img src="${esc(x.mediaUrl)}">`:'';
 else if(x.type==='video')inner=x.mediaUrl?`<video src="${esc(x.mediaUrl)}" ${x.autoplay!==false?'autoplay':''} ${x.loopVideo?'loop':''} muted playsinline></video>`:'';
 else if(x.type==='text')inner=`<div class="txt ${x.textAlign||'center'}" style="color:${x.textColor||'#fff'};background:${x.backgroundColor||'transparent'};font-size:${({sm:'22px',md:'34px',lg:'50px',xl:'70px'})[x.textSize]||'50px'}">${esc(x.description)}</div>`;
 else if(x.type==='notice')inner=`<div class="notice"><span class="notice-tag" style="background:${x.noticeLevel==='urgente'?'#dc2626':x.noticeLevel==='atencao'?'#d97706':'#2563eb'}">${typeLabel(x.noticeLevel)}</span><h2>${esc(x.title)}</h2><p>${esc(x.description)}</p></div>`;
 else if(x.type==='event')inner=`<div class="event"><div class="ico">◷</div><h2>${esc(x.title)}</h2><p>${esc(x.description)}</p><div class="when">${x.eventDate?`<span>📅 ${esc(x.eventDate)}</span>`:''}${x.eventTime?`<span>🕐 ${esc(x.eventTime)}</span>`:''}${x.eventLocation?`<span>📍 ${esc(x.eventLocation)}</span>`:''}</div></div>`;
 const stage=document.getElementById('stage');
 stage.innerHTML='';
 const div=document.createElement('div');
 div.className='slide '+(x.transition||'fade');
 div.innerHTML=inner;
 stage.appendChild(div);
 requestAnimationFrame(()=>requestAnimationFrame(()=>div.classList.add('in')));
}
function showEmpty(){
 document.getElementById('stage').innerHTML=`<div id="empty"><h1>${esc(db?.settings?.schoolName||'Escola José Giestas')}</h1><p>Nenhum conteúdo ativo no momento.</p></div>`;
 document.getElementById('dots').innerHTML='';
 document.getElementById('progressBar').style.width='0%';
}
function next(){
 idx=(idx+1)%list.length;
 playCurrent();
}
function playCurrent(){
 clearInterval(timer);
 const x=list[idx];
 dur=Math.max(1,+x.duration||10);
 elapsed=0;
 renderSlide(x);
 buildDots();
 document.getElementById('progressBar').style.width='0%';
 timer=setInterval(()=>{
  elapsed+=0.1;
  document.getElementById('progressBar').style.width=Math.min(100,(elapsed/dur)*100)+'%';
  if(elapsed>=dur)next();
 },100);
}
function onData(nd){
 db=nd;applyTheme();
 const newList=(db.contents||[]).filter(c=>c.active).sort((a,b)=>a.order-b.order);
 const sameIds=JSON.stringify(newList.map(c=>c.id))===JSON.stringify(list.map(c=>c.id));
 list=newList;
 if(!list.length){clearInterval(timer);showEmpty();return}
 if(!sameIds){idx=Math.min(idx,list.length-1);playCurrent()}
}
function updateClock(){
 const d=new Date();
 document.getElementById('clockTime').textContent=d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
 document.getElementById('clockDate').textContent=d.toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long'});
}
function toggleFullscreen(){
 if(!document.fullscreenElement)document.documentElement.requestFullscreen?.().catch(()=>{});
}
document.getElementById('exitBtn').onclick=()=>{
